<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 262" width="860" height="262" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Yu Gothic UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans CJK JP&quot;, sans-serif" role="img"><title>OS ごとのインストールの流れ</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#52514e"/></marker></defs><rect width="860" height="262" rx="8" fill="#fcfcfb"/><text x="16.0" y="51.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Windows</text><rect x="110.0" y="18.0" width="160.0" height="56.0" rx="6" fill="#f0efec"/><text x="190.0" y="41.7" font-size="13" fill="#0b0b0b" text-anchor="middle">Releases</text><text x="190.0" y="59.7" font-size="12" fill="#52514e" text-anchor="middle">ダウンロード</text><line x1="271.0" y1="46.0" x2="293.0" y2="46.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="295.0" y="18.0" width="160.0" height="56.0" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/><text x="375.0" y="41.7" font-size="13" fill="#0b0b0b" text-anchor="middle">.NET、ffmpeg</text><text x="375.0" y="59.7" font-size="12" fill="#52514e" text-anchor="middle">どちらも不要</text><line x1="456.0" y1="46.0" x2="478.0" y2="46.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="480.0" y="18.0" width="160.0" height="56.0" rx="6" fill="#e4effc"/><text x="560.0" y="41.7" font-size="13" fill="#0b0b0b" text-anchor="middle">BeepDump.exe</text><text x="560.0" y="59.7" font-size="12" fill="#52514e" text-anchor="middle">ダブルクリックで起動</text><text x="16.0" y="127.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Linux</text><rect x="110.0" y="94.0" width="160.0" height="56.0" rx="6" fill="#f0efec"/><text x="190.0" y="117.7" font-size="13" fill="#0b0b0b" text-anchor="middle">.NET 10 SDK</text><text x="190.0" y="135.7" font-size="12" fill="#52514e" text-anchor="middle">ビルドに使う</t