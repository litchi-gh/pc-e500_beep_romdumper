<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 252" width="860" height="252" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Yu Gothic UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans CJK JP&quot;, sans-serif" role="img"><title>Deciding bit by bit</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#52514e"/></marker></defs><rect width="860" height="252" rx="8" fill="#fcfcfb"/><text x="16.0" y="48.0" font-size="13" fill="#52514e" text-anchor="start">Bits</text><rect x="150.0" y="28.0" width="39.0" height="30.0" rx="6" fill="#f0efec"/><text x="169.5" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle">1</text><rect x="192.0" y="28.0" width="39.0" height="30.0" rx="6" fill="#f0efec"/><text x="211.5" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle">0</text><rect x="234.0" y="28.0" width="39.0" height="30.0" rx="6" fill="#f0efec"/><text x="253.5" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle">1</text><rect x="276.0" y="28.0" width="39.0" height="30.0" rx="6" fill="#f0efec"/><text x="295.5" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle">1</text><rect x="318.0" y="28.0" width="39.0" height="30.0" rx="6" fill="#f0efec"/><text x="337.5" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle">0</text><rect x="360.0" y="28.0" width="39.0" height="30.0" rx="6" fill="#f0efec"/><text x="379.5" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle">0</text><rect x="402.0" y="28.0" width="39.0" height="30.0" rx="6" fill="#fde9e0"/><text x="421.5" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle">?</text><rect x="444.0" y="28.0" width="39.0" height="30.0" rx="6" fill="#e4effc"/><text x="463.5" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle">?</text><rect x="486.0" y="28.0" width="39.0" height="30.0" rx="6" fill="#e4effc"/><text x="505.5" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle">?</text><rect x="528.0" y="28.0" width="39.0" height="30.0" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/><text x="547.5" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle"></text><rect x="570.0" y="28.0" width="39.0" height="30.0" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/><text x="589.5" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle"></text><rect x="612.0" y="28.0" width="39.0" height="30.0" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/><text x="631.5" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle"></text><text x="276.0" y="78.0" font-size="12" fill="#52514e" text-anchor="middle">Decided</text><text x="465.0" y="78.0" font-size="12" fill="#52514e" text-anchor="middle">3-bit lookahead</text><circle cx="28" cy="104" r="11" fill="#2a78d6"/><text x="28.0" y="108.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">1</text><text x="48.0" y="109.0" font-size="13" fill="#0b0b0b" text-anchor="start">Subtract the responses of decided bits, ring included, from the recording</text><circle cx="28" cy="138" r="11" fill="#2a78d6"/><text x="28.0" y="142.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">2</text><text x="48.0" y="143.0" font-size="13" fill="#0b0b0b" text-anchor="start">Compute the waveform of all 8 combinations of the next 3 bits, and find the closest</text><circle cx="28" cy="172" r="11" fill="#2a78d6"/><text x="28.0" y="176.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">3</text><text x="48.0" y="177.0" font-size="13" fill="#0b0b0b" text-anchor="start">Decide only the first bit (orange). A small difference between 0 and 1 is noted as low confidence</text><circle cx="28" cy="206" r="11" fill="#2a78d6"/><text x="28.0" y="210.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">4</text><text x="48.0" y="211.0" font-size="13" fill="#0b0b0b" text-anchor="start">Move on one bit. Correct timing drift and level changes now and then</text></svg>
