<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Yu Gothic UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans CJK JP&quot;, sans-serif" role="img"><title>学習と読み直しの流れ</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#52514e"/></marker></defs><rect width="860" height="310" rx="8" fill="#fcfcfb"/><rect x="20.0" y="24.0" width="180.0" height="56.0" rx="6" fill="#fde9e0"/><text x="110.0" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle">学習</text><text x="110.0" y="65.7" font-size="12" fill="#52514e" text-anchor="middle">学習用の並びから 6 ms</text><line x1="200.0" y1="52.0" x2="240.0" y2="52.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="240.0" y="24.0" width="180.0" height="56.0" rx="6" fill="#f0efec"/><text x="330.0" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle">全ブロックを読む</text><text x="330.0" y="65.7" font-size="12" fill="#52514e" text-anchor="middle">候補とずれを試す</text><line x1="420.0" y1="52.0" x2="460.0" y2="52.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="460.0" y="24.0" width="160.0" height="56.0" rx="6" fill="#e4effc"/><text x="540.0" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle">検査</text><text x="540.0" y="65.7" font-size="12" fill="#52514e" text-anchor="middle">番地のつながりも</text><line x1="620.0" y1="52.0" x2="680.0" y2="52.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="650.0" y="44.0" font-size="12" fill="#52514e" text-anchor="middle">通る</text><rect x="680.0" y="24.0" width="160.0" height="56.0" rx="6" fill="#d7f0d7"/><text x="760.0" y="56.7" font-size="13" fill="#0b0b0b" text-anchor="middle">読めた（緑）</text><line x1="540.0" y1="80.0" x2="540.0" y2="130.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="548.0" y="110.0" font-size="12" fill="#52514e" text-anchor="start">通らない</text><rect x="450.0" y="130.0" width="180.0" height="56.0" rx="6" fill="#fde9e0"/><text x="540.0" y="153.7" font-size="13" fill="#0b0b0b" text-anchor="middle">学び直し</text><text x="540.0" y="171.7" font-size="12" fill="#52514e" text-anchor="middle">読めた内容で 20 ms</text><path d="M450 158 L330 158 L330 81" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="338.0" y="150.0" font-size="12" fill="#52514e" text-anchor="start">読み直す（最大 3 回）</text><line x1="540.0" y1="186.0" x2="540.0" y2="226.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="548.0" y="210.0" font-size="12" fill="#52514e" text-anchor="start">増えなくなったら</text><rect x="430.0" y="226.0" width="220.0" height="62.0" rx="6" fill="#e4effc"/><text x="540.0" y="243.7" font-size="13" fill="#0b0b0b" text-anchor="middle">修復</text><text x="540.0" y="261.7" font-size="12" fill="#52514e" text-anchor="middle">自信のないビットを反転</text><text x="540.0" y="279.7" font-size="12" fill="#52514e" text-anchor="middle">検査と番地の一致を確かめる</text><path d="M650 240 L760 240 L760 81" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="668.0" y="232.0" font-size="12" fill="#52514e" text-anchor="start">通る（黄）</text><line x1="430.0" y1="257.0" x2="250.0" y2="257.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340.0" y="249.0" font-size="12" fill="#52514e" text-anchor="middle">通らない</text><rect x="40.0" y="228.0" width="210.0" height="58.0" rx="6" fill="#f7d6d6"/><text x="145.0" y="252.7" font-size="13" fill="#0b0b0b" text-anchor="middle">読めなかった（赤）</text><text x="145.0" y="270.7" font-size="12" fill="#52514e" text-anchor="middle">次のパターンか録り直しへ</text></svg>
