37.0" height="32.0" rx="6" fill="#f0efec"/><text x="648.5" y="214.7" font-size="13" fill="#0b0b0b" text-anchor="middle">0</text><rect x="670.0" y="194.0" width="37.0" height="32.0" rx="6" fill="#f0efec"/><text x="688.5" y="214.7" font-size="13" fill="#0b0b0b" text-anchor="middle">0</text><rect x="716.0" y="194.0" width="104.0" height="32.0" rx="6" fill="#d7f0d7"/><text x="768.0" y="214.3" font-size="12" fill="#0b0b0b" text-anchor="middle">Check: pass</text><text x="380.0" y="244.0" font-size="12" fill="#52514e" text-anchor="end">flipped</text><text x="394.0" y="244.0" font-size="12" fill="#52514e" text-anchor="start">fixed too</text><text x="16.0" y="276.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">4. Accept if the check passes and the address fits</text><rect x="16.0" y="290.0" width="16.0" height="16.0" rx="2" fill="#fab219"/><text x="40.0" y="303.0" font-size="13" fill="#0b0b0b" text-anchor="start">A yellow cell in the window (it goes into the ROM as read)</text><text x="16.0" y="336.0" font-size="12" fill="#52514e" text-anchor="start">An illustration. If it fails, the next lowest is tried: the 48 lowest one at a time, then pairs from the 10 lowest. If all fail, the cell stays red.</text></svg>
