<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 158" width="860" height="158" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Yu Gothic UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans CJK JP&quot;, sans-serif" role="img"><title>録音を始めるタイミング</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#52514e"/></marker></defs><rect width="860" height="158" rx="8" fill="#fcfcfb"/><rect x="14.0" y="30.0" width="96.0" height="58.0" rx="6" fill="#f0efec"/><text x="62.0" y="63.7" font-size="13" fill="#0b0b0b" text-anchor="middle">RUN</text><rect x="120.0" y="30.0" width="130.0" height="58.0" rx="6" fill="#f0efec"/><text x="185.0" y="54.7" font-size="13" fill="#0b0b0b" text-anchor="middle">1 つ目の ?</text><text x="185.0" y="72.7" font-size="12" fill="#52514e" text-anchor="middle">&amp;HC0000</text><line x1="111.0" y1="59.0" x2="119.0" y2="59.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="260.0" y="30.0" width="130.0" height="58.0" rx="6" fill="#f0efec"/><text x="325.0" y="54.7" font-size="13" fill="#0b0b0b" text-anchor="middle">2 つ目の ?</text><text x="325.0" y="72.7" font-size="12" fill="#52514e" text-anchor="middle">&amp;HFFFFF</text><line x1="251.0" y1="59.0" x2="259.0" y2="59.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="400.0" y="30.0" width="110.0" height="58.0" rx="6" fill="#f7d6d6"/><text x="455.0" y="63.7" font-size="13" fill="#0b0b0b" text-anchor="middle">録音開始</text><line x1="391.0" y1="59.0" x2="399.0" y2="59.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="520.0" y="30.0" width="80.0" height="58.0" rx="6" fill="#f0efec"/><text x="560.0" y="63.7" font-size="13" fill="#0b0b0b" text-anchor="middle">ENTER</text><line x1="511.0" y1="59.0" x2="519.0" y2="59.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="610.0" y="30.0" width="130.0" height="58.0" rx="6" fill="#e4effc"/><text x="675.0" y="54.7" font-size="13" fill="#0b0b0b" text-anchor="middle">音が鳴る</text><text x="675.0" y="72.7" font-size="12" fill="#52514e" text-anchor="middle">キーに触らない</text><line x1="601.0" y1="59.0" x2="609.0" y2="59.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="750.0" y="30.0" width="96.0" height="58.0" rx="6" fill="#f7d6d6"/><text x="798.0" y="54.7" font-size="13" fill="#0b0b0b" text-anchor="middle">&gt; が出たら</text><text x="798.0" y="72.7" font-size="12" fill="#52514e" text-anchor="middle">録音停止</text><line x1="741.0" y1="59.0" x2="749.0" y2="59.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="14.0" y1="116.0" x2="846.0" y2="116.0" stroke="#c3c2b7" stroke-width="1"/><path d="M455 88 L455 106" fill="none" stroke="#d03b3b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="455.0" y="136.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">2 つ目の ENTER を押す前に録音を始める</text></svg>
