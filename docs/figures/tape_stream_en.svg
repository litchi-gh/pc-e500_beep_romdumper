<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 196" width="860" height="196" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Yu Gothic UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans CJK JP&quot;, sans-serif" role="img"><title>CSAVE M sound layout</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#52514e"/></marker></defs><rect width="860" height="196" rx="8" fill="#fcfcfb"/><text x="16.0" y="24.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">Header section</text><rect x="16.0" y="32.0" width="228.0" height="46.0" rx="6" fill="#f0efec"/><text x="130.0" y="50.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Carrier</text><text x="130.0" y="67.8" font-size="11" fill="#52514e" text-anchor="middle">10000 cycles, about 3.3 s</text><rect x="246.0" y="32.0" width="80.0" height="46.0" rx="6" fill="#f0efec"/><text x="286.0" y="50.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Long</text><text x="286.0" y="67.8" font-size="11" fill="#52514e" text-anchor="middle">40 cycles</text><rect x="328.0" y="32.0" width="80.0" height="46.0" rx="6" fill="#f0efec"/><text x="368.0" y="50.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Short</text><text x="368.0" y="67.8" font-size="11" fill="#52514e" text-anchor="middle">40 cycles</text><rect x="410.0" y="32.0" width="68.0" height="46.0" rx="6" fill="#f0efec"/><text x="444.0" y="50.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Long</text><text x="444.0" y="67.8" font-size="11" fill="#52514e" text-anchor="middle">1 cycle</text><rect x="480.0" y="32.0" width="362.0" height="46.0" rx="6" fill="#fde9e0"/><text x="661.0" y="50.8" font-size="12" fill="#0b0b0b" text-anchor="middle">50 header bytes</text><text x="661.0" y="67.8" font-size="11" fill="#52514e" text-anchor="middle">start address, length, name</text><text x="16.0" y="104.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">Data section</text><rect x="16.0" y="112.0" width="228.0" height="46.0" rx="6" fill="#f0efec"/><text x="130.0" y="130.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Carrier</text><text x="130.0" y="147.8" font-size="11" fill="#52514e" text-anchor="middle">11000 cycles, about 3.7 s</text><rect x="246.0" y="112.0" width="80.0" height="46.0" rx="6" fill="#f0efec"/><text x="286.0" y="130.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Long</text><text x="286.0" y="147.8" font-size="11" fill="#52514e" text-anchor="middle">20 cycles</text><rect x="328.0" y="112.0" width="80.0" height="46.0" rx="6" fill="#f0efec"/><text x="368.0" y="130.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Short</text><text x="368.0" y="147.8" font-size="11" fill="#52514e" text-anchor="middle">20 cycles</text><rect x="410.0" y="112.0" width="68.0" height="46.0" rx="6" fill="#f0efec"/><text x="444.0" y="130.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Long</text><text x="444.0" y="147.8" font-size="11" fill="#52514e" text-anchor="middle">1 cycle</text><rect x="480.0" y="112.0" width="242.0" height="46.0" rx="6" fill="#e4effc"/><text x="601.0" y="130.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Data</text><text x="601.0" y="147.8" font-size="11" fill="#52514e" text-anchor="middle">from the start address</text><rect x="724.0" y="112.0" width="118.0" height="46.0" rx="6" fill="#fde9e0"/><text x="783.0" y="130.8" font-size="12" fill="#0b0b0b" text-anchor="middle">2-byte check</text><text x="783.0" y="147.8" font-size="11" fill="#52514e" text-anchor="middle">count of 1 bits</text><text x="16.0" y="182.0" font-size="12" fill="#52514e" text-anchor="start">The data carries no addresses and no per-block checks; the only check is one value at the very end</text></svg>
