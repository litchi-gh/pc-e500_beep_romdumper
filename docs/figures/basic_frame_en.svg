<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 244" width="860" height="244" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Yu Gothic UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans CJK JP&quot;, sans-serif" role="img"><title>BASIC sound layout</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#52514e"/></marker></defs><rect width="860" height="244" rx="8" fill="#fcfcfb"/><text x="16.0" y="22.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">One block (259 tones)</text><rect x="16.0" y="34.0" width="118.0" height="40.0" rx="6" fill="#fde9e0"/><text x="75.0" y="58.3" font-size="12" fill="#0b0b0b" text-anchor="middle">Address ÷ 5000</text><rect x="136.0" y="34.0" width="498.0" height="40.0" rx="6" fill="#e4effc"/><text x="385.0" y="58.3" font-size="12" fill="#0b0b0b" text-anchor="middle">256 data bytes (256 tones)</text><rect x="636.0" y="34.0" width="108.0" height="40.0" rx="6" fill="#fde9e0"/><text x="690.0" y="58.3" font-size="12" fill="#0b0b0b" text-anchor="middle">Low of S</text><rect x="746.0" y="34.0" width="108.0" height="40.0" rx="6" fill="#fde9e0"/><text x="800.0" y="58.3" font-size="12" fill="#0b0b0b" text-anchor="middle">S ÷ 257</text><text x="16.0" y="106.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">One tone</text><path d="M20 150L60 150L60 126L77.0 126L77.0 174L94 174L94 150L94 150L94 126L111.0 126L111.0 174L128 174L128 150L128 150L128 126L145.0 126L145.0 174L162 174L162 150L162 150L162 126L179.0 126L179.0 174L196 174L196 150L196 150L196 126L213.0 126L213.0 174L230 174L230 150L230 150L230 126L247.0 126L247.0 174L264 174L264 150L264 150L264 126L281.0 126L281.0 174L298 174L298 150L298 150L298 126L315.0 126L315.0 174L332 174L332 150L422 150" fill="none" stroke="#0b0b0b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="60.0" y1="190.0" x2="94.0" y2="190.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="77.0" y="208.0" font-size="12" fill="#52514e" text-anchor="middle">period</text><line x1="94.0" y1="184.0" x2="94.0" y2="196.0" stroke="#c3c2b7" stroke-width="1"/><text x="180.0" y="195.0" font-size="13" fill="#0b0b0b" text-anchor="start">period = scale × (90 + 4 × value) ÷ 256000 s</text><text x="180.0" y="216.0" font-size="13" fill="#52514e" text-anchor="start">8 periods, then silence while BASIC runs</text><path d="M422 150L422 126L444 126L444 174L466 174L466 150L488 150" fill="none" stroke="#0b0b0b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="492.0" y="138.0" font-size="12" fill="#52514e" text-anchor="start">next</text><line x1="60.0" y1="116.0" x2="60.0" y2="108.0" stroke="#c3c2b7" stroke-width="1"/><line x1="422.0" y1="116.0" x2="422.0" y2="108.0" stroke="#c3c2b7" stroke-width="1"/><path d="M60 112 L421 112" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="241.0" y="106.0" font-size="12" fill="#52514e" text-anchor="middle">interval = 8 periods + processing time</text></svg>
