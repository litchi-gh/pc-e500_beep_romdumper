<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 158" width="860" height="158" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Yu Gothic UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans CJK JP&quot;, sans-serif" role="img"><title>CSAVE M の録音の流れ</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#52514e"/></marker></defs><rect width="860" height="158" rx="8" fill="#fcfcfb"/><rect x="14.0" y="30.0" width="104.0" height="58.0" rx="6" fill="#f0efec"/><text x="66.0" y="54.8" font-size="12" fill="#0b0b0b" text-anchor="middle">BASIC</text><text x="66.0" y="71.8" font-size="11" fill="#52514e" text-anchor="middle">RUN モード</text><rect x="134.0" y="30.0" width="216.0" height="58.0" rx="6" fill="#f0efec"/><text x="242.0" y="54.8" font-size="12" fill="#0b0b0b" text-anchor="middle">命令を打つ</text><text x="242.0" y="71.8" font-size="11" fill="#52514e" text-anchor="middle">CSAVE M &amp;HC0000,&amp;HFFFFF</text><line x1="119.0" y1="59.0" x2="133.0" y2="59.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="366.0" y="30.0" width="96.0" height="58.0" rx="6" fill="#f7d6d6"/><text x="414.0" y="63.3" font-size="12" fill="#0b0b0b" text-anchor="middle">録音開始</text><line x1="351.0" y1="59.0" x2="365.0" y2="59.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="478.0" y="30.0" width="72.0" height="58.0" rx="6" fill="#f0efec"/><text x="514.0" y="63.3" font-size="12" fill="#0b0b0b" text-anchor="middle">ENTER</text><line x1="463.0" y1="59.0" x2="477.0" y2="59.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="566.0" y="30.0" width="146.0" height="58.0" rx="6" fill="#e4effc"/><text x="639.0" y="54.8" font-size="12" fill="#0b0b0b" text-anchor="middle">音が鳴る（約 22 分）</text><text x="639.0" y="71.8" font-size="11" fill="#52514e" text-anchor="middle">キーに触らない</text><line x1="551.0" y1="59.0" x2="565.0" y2="59.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="728.0" y="30.0" width="118.0" height="58.0" rx="6" fill="#f7d6d6"/><text x="787.0" y="54.8" font-size="12" fill="#0b0b0b" text-anchor="middle">&gt; が出たら</text><text x="787.0" y="71.8" font-size="11" fill="#52514e" text-anchor="middle">録音停止</text><line x1="713.0" y1="59.0" x2="727.0" y2="59.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="14.0" y1="116.0" x2="846.0" y2="116.0" stroke="#c3c2b7" stroke-width="1"/><path d="M414 88 L414 106" fill="none" stroke="#d03b3b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="430.0" y="136.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">ENTER を押す前に録音を始める。読み違いを見つけるため、同じことをもう 1 回録音する</text></svg>
