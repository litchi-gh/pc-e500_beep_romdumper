<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Yu Gothic UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans CJK JP&quot;, sans-serif" role="img"><title>CSAVE M の読み取りの流れ</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#52514e"/></marker></defs><rect width="860" height="300" rx="8" fill="#fcfcfb"/><rect x="16.0" y="22.0" width="192.0" height="62.0" rx="6" fill="#f0efec"/><text x="112.0" y="48.8" font-size="12" fill="#0b0b0b" text-anchor="middle">搬送音を探す</text><text x="112.0" y="65.8" font-size="11" fill="#52514e" text-anchor="middle">10000 周期と 11000 周期の組</text><line x1="208.0" y1="53.0" x2="230.0" y2="53.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="230.0" y="22.0" width="192.0" height="62.0" rx="6" fill="#f0efec"/><text x="326.0" y="48.8" font-size="12" fill="#0b0b0b" text-anchor="middle">ヘッダの前半で学ぶ</text><text x="326.0" y="65.8" font-size="11" fill="#52514e" text-anchor="middle">01h、名前、0Dh は形が決まっている</text><line x1="422.0" y1="53.0" x2="444.0" y2="53.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="444.0" y="22.0" width="192.0" height="62.0" rx="6" fill="#f0efec"/><text x="540.0" y="48.8" font-size="12" fill="#0b0b0b" text-anchor="middle">本体を 3000 バイト読む</text><text x="540.0" y="65.8" font-size="11" fill="#52514e" text-anchor="middle">応答とビットの長さを学び直す</text><line x1="636.0" y1="53.0" x2="658.0" y2="53.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="658.0" y="22.0" width="192.0" height="62.0" rx="6" fill="#f0efec"/><text x="754.0" y="48.8" font-size="12" fill="#0b0b0b" text-anchor="middle">ヘッダを読む</text><text x="754.0" y="65.8" font-size="11" fill="#52514e" text-anchor="middle">位置を変えて読み、多数決で決める</text><path d="M766 84 L766 108 L112 108 L112 124" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="430.0" y="102.0" font-size="12" fill="#52514e" text-anchor="middle">ヘッダが読めなければ、位置をずらして本体からやり直す（最大 9 通り）</text><rect x="16.0" y="124.0" width="828.0" height="84.0" rx="8" fill="#e4effc"/><text x="30.0" y="144.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">本体を最後まで読む</text><rect x="30.0" y="152.0" width="188.0" height="46.0" rx="6" fill="#fcfcfb"/><text x="124.0" y="170.8" font-size="12" fill="#0b0b0b" text-anchor="middle">1 バイトずつ</text><text x="124.0" y="187.8" font-size="11" fill="#52514e" text-anchor="middle">256 通りの波形と比べる</text><line x1="218.0" y1="175.0" x2="232.0" y2="175.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="232.0" y="152.0" width="188.0" height="46.0" rx="6" fill="#fcfcfb"/><text x="326.0" y="170.8" font-size="12" fill="#0b0b0b" text-anchor="middle">FFh の並び</text><text x="326.0" y="187.8" font-size="11" fill="#52514e" text-anchor="middle">時間から数を数える</text><line x1="420.0" y1="175.0" x2="434.0" y2="175.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="434.0" y="152.0" width="188.0" height="46.0" rx="6" fill="#fcfcfb"/><text x="528.0" y="170.8" font-size="12" fill="#0b0b0b" text-anchor="middle">見失ったら</text><text x="528.0" y="187.8" font-size="11" fill="#52514e" text-anchor="middle">戻って別の道も試す</text><line x1="622.0" y1="175.0" x2="636.0" y2="175.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="636.0" y="152.0" width="188.0" height="46.0" rx="6" fill="#fcfcfb"/><text x="730.0" y="170.8" font-size="12" fill="#0b0b0b" text-anchor="middle">仕上げ</text><text x="730.0" y="187.8" font-size="11" fill="#52514e" text-anchor="middle">ビットの入れ替わりを直す</text><line x1="430.0" y1="208.0" x2="430.0" y2="228.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16.0" y="228.0" width="268.0" height="56.0" rx="6" fill="#f0efec"/><text x="150.0" y="251.8" font-size="12" fill="#0b0b0b" text-anchor="middle">物音の大きかったバイトを除く</text><text x="150.0" y="268.8" font-size="11" fill="#52514e" text-anchor="middle">含むブロックは読めなかったことに（赤）</text><line x1="284.0" y1="256.0" x2="300.0" y2="256.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="300.0" y="228.0" width="260.0" height="56.0" rx="6" fill="#f0efec"/><text x="430.0" y="251.8" font-size="12" fill="#0b0b0b" text-anchor="middle">ヘッダの番地から順に番地を付ける</text><text x="430.0" y="268.8" font-size="11" fill="#52514e" text-anchor="middle">読めたブロックはすべて黄</text><line x1="560.0" y1="256.0" x2="576.0" y2="256.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="576.0" y="228.0" width="268.0" height="56.0" rx="6" fill="#f0efec"/><text x="710.0" y="251.8" font-size="12" fill="#0b0b0b" text-anchor="middle">ほかの録音と比べる</text><text x="710.0" y="268.8" font-size="11" fill="#52514e" text-anchor="middle">一致すれば緑、違えば赤</text></svg>
