<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Yu Gothic UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans CJK JP&quot;, sans-serif" role="img"><title>Learning and reading again</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#52514e"/></marker></defs><rect width="860" height="310" rx="8" fill="#fcfcfb"/><rect x="20.0" y="24.0" width="180.0" height="56.0" rx="6" fill="#fde9e0"/><text x="110.0" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle">Learn</text><text x="110.0" y="65.7" font-size="12" fill="#52514e" text-anchor="middle">6 ms from the sequence</text><line x1="200.0" y1="52.0" x2="240.0" y2="52.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="240.0" y="24.0" width="180.0" height="56.0" rx="6" fill="#f0efec"/><text x="330.0" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle">Read every block</text><text x="330.0" y="65.7" font-size="12" fill="#52514e" text-anchor="middle">trying candidates, shifts</text><line x1="420.0" y1="52.0" x2="460.0" y2="52.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="460.0" y="24.0" width="160.0" height="56.0" rx="6" fill="#e4effc"/><text x="540.0" y="47.7" font-size="13" fill="#0b0b0b" text-anchor="middle">Check</text><text x="540.0" y="65.7" font-size="12" fill="#52514e" text-anchor="middle">and address continuity</text><line x1="620.0" y1="52.0" x2="680.0" y2="52.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="650.0" y="44.0" font-size="12" fill="#52514e" text-anchor="middle">pass</text><rect x="680.0" y="24.0" width="160.0" height="56.0" rx="6" fill="#d7f0d7"/><text x="760.0" y="56.7" font-size="13" fill="#0b0b0b" text-anchor="middle">Read (green)</text><line x1="540.0" y1="80.0" x2="540.0" y2="130.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="548.0" y="110.0" font-size="12" fill="#52514e" text-anchor="start">fail</text><rect x="450.0" y="130.0" width="180.0" height="56.0" rx="6" fill="#fde9e0"/><text x="540.0" y="153.7" font-size="13" fill="#0b0b0b" text-anchor="middle">Learn again</text><text x="540.0" y="171.7" font-size="12" fill="#52514e" text-anchor="middle">20 ms from blocks read</text><path d="M450 158 L330 158 L330 81" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="338.0" y="150.0" font-size="12" fill="#52514e" text-anchor="start">Read again (max 3)</text><line x1="540.0" y1="186.0" x2="540.0" y2="226.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="548.0" y="210.0" font-size="12" fill="#52514e" text-anchor="start">when it gains no more</text><rect x="430.0" y="226.0" width="220.0" height="62.0" rx="6" fill="#e4effc"/><text x="540.0" y="243.7" font-size="13" fill="#0b0b0b" text-anchor="middle">Repair</text><text x="540.0" y="261.7" font-size="12" fill="#52514e" text-anchor="middle">flip low-confidence bits</text><text x="540.0" y="279.7" font-size="12" fill="#52514e" text-anchor="middle">check and address must match</text><path d="M650 240 L760 240 L760 81" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="668.0" y="232.0" font-size="12" fill="#52514e" text-anchor="start">pass (yellow)</text><line x1="430.0" y1="257.0" x2="250.0" y2="257.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340.0" y="249.0" font-size="12" fill="#52514e" text-anchor="middle">fail</text><rect x="40.0" y="228.0" width="210.0" height="58.0" rx="6" fill="#f7d6d6"/><text x="145.0" y="252.7" font-size="13" fill="#0b0b0b" text-anchor="middle">Not read (red)</text><text x="145.0" y="270.7" font-size="12" fill="#52514e" text-anchor="middle">next pattern, or a retake</text></svg>
