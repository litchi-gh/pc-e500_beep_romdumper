<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 256" width="860" height="256" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Yu Gothic UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans CJK JP&quot;, sans-serif" role="img"><title>番地の検査</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#52514e"/></marker></defs><rect width="860" height="256" rx="8" fill="#fcfcfb"/><text x="16.0" y="24.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">20 bit の番地のうち、検査で確かめられる部分</text><rect x="40.0" y="36.0" width="310.0" height="34.0" rx="6" fill="#fde9e0" stroke="#eb6834"/><text x="195.0" y="57.3" font-size="12" fill="#0b0b0b" text-anchor="middle">上位 8 bit（S2 は見ない）</text><rect x="352.0" y="36.0" width="154.0" height="34.0" rx="6" fill="#d7f0d7" stroke="#0ca30c"/><text x="429.0" y="57.3" font-size="12" fill="#0b0b0b" text-anchor="middle">4 bit</text><rect x="508.0" y="36.0" width="310.0" height="34.0" rx="6" fill="#d7f0d7" stroke="#0ca30c"/><text x="663.0" y="57.3" font-size="12" fill="#0b0b0b" text-anchor="middle">下位 8 bit（必ず 0）</text><text x="40.0" y="92.0" font-size="13" fill="#52514e" text-anchor="start">S2 は番地の 256 倍を足す形なので、番地の上位 8 bit が変わっても S2 は変わらない。</text><text x="16.0" y="130.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">そこで前後のブロックとのつながりを確かめる</text><rect x="40.0" y="144.0" width="120.0" height="40.0" rx="6" fill="#d7f0d7" stroke="#0ca30c"/><text x="100.0" y="168.7" font-size="13" fill="#0b0b0b" text-anchor="middle">21F00</text><line x1="161.0" y1="164.0" x2="195.0" y2="164.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="198.0" y="144.0" width="120.0" height="40.0" rx="6" fill="#d7f0d7" stroke="#0ca30c"/><text x="258.0" y="168.7" font-size="13" fill="#0b0b0b" text-anchor="middle">22000</text><line x1="319.0" y1="164.0" x2="353.0" y2="164.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="356.0" y="144.0" width="120.0" height="40.0" rx="6" fill="#f7d6d6" stroke="#d03b3b"/><text x="416.0" y="168.7" font-size="13" fill="#0b0b0b" text-anchor="middle">62100</text><line x1="477.0" y1="164.0" x2="511.0" y2="164.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="514.0" y="144.0" width="120.0" height="40.0" rx="6" fill="#d7f0d7" stroke="#0ca30c"/><text x="574.0" y="168.7" font-size="13" fill="#0b0b0b" text-anchor="middle">22200</text><line x1="635.0" y1="164.0" x2="669.0" y2="164.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="672.0" y="144.0" width="120.0" height="40.0" rx="6" fill="#d7f0d7" stroke="#0ca30c"/><text x="732.0" y="168.7" font-size="13" fill="#0b0b0b" text-anchor="middle">22300</text><text x="416.0" y="208.0" font-size="13" fill="#0b0b0b" text-anchor="middle">データは正しいが番地が違う → 捨てる</text><text x="416.0" y="228.0" font-size="12" fill="#52514e" text-anchor="middle">（読み直しか修復で 22100 として読める）</text></svg>
