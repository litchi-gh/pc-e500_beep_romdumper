<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 232" width="860" height="232" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Yu Gothic UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans CJK JP&quot;, sans-serif" role="img"><title>Machine-code sound layout</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#52514e"/></marker></defs><rect width="860" height="232" rx="8" fill="#fcfcfb"/><text x="16.0" y="20.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">A whole recording</text><rect x="16.0" y="34.0" width="110.0" height="40.0" rx="6" fill="#fde9e0"/><text x="71.0" y="49.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Learning</text><text x="71.0" y="66.8" font-size="11" fill="#52514e" text-anchor="middle">about 0.44 s</text><rect x="138.0" y="34.0" width="170.0" height="40.0" rx="6" fill="#e4effc"/><text x="223.0" y="49.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Block</text><text x="223.0" y="66.8" font-size="11" fill="#52514e" text-anchor="middle">about 0.89 s</text><rect x="320.0" y="34.0" width="170.0" height="40.0" rx="6" fill="#e4effc"/><text x="405.0" y="58.3" font-size="12" fill="#0b0b0b" text-anchor="middle">Block</text><rect x="502.0" y="34.0" width="170.0" height="40.0" rx="6" fill="#e4effc"/><text x="587.0" y="58.3" font-size="12" fill="#0b0b0b" text-anchor="middle">Block</text><text x="688.0" y="59.0" font-size="18" fill="#52514e" text-anchor="start">…</text><line x1="126.0" y1="86.0" x2="138.0" y2="86.0" stroke="#52514e" stroke-width="1"/><text x="132.0" y="102.0" font-size="12" fill="#52514e" text-anchor="start">Silence, about 10 ms</text><path d="M138 74 L16 134" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M308 74 L844 134" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="16.0" y="128.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">One block (265 bytes)</text><rect x="16.0" y="136.0" width="42.0" height="44.0" rx="6" fill="#f0efec"/><text x="37.0" y="153.8" font-size="12" fill="#0b0b0b" text-anchor="middle">$00</text><text x="37.0" y="170.8" font-size="11" fill="#52514e" text-anchor="middle">sync</text><rect x="60.0" y="136.0" width="42.0" height="44.0" rx="6" fill="#f0efec"/><text x="81.0" y="162.3" font-size="12" fill="#0b0b0b" text-anchor="middle">$00</text><rect x="104.0" y="136.0" width="42.0" height="44.0" rx="6" fill="#f0efec"/><text x="125.0" y="162.3" font-size="12" fill="#0b0b0b" text-anchor="middle">$A5</text><rect x="148.0" y="136.0" width="468.0" height="44.0" rx="6" fill="#e4effc"/><text x="382.0" y="153.8" font-size="12" fill="#0b0b0b" text-anchor="middle">256 data bytes</text><text x="382.0" y="170.8" font-size="11" fill="#52514e" text-anchor="middle">LSB first</text><rect x="618.0" y="136.0" width="108.0" height="44.0" rx="6" fill="#fde9e0"/><text x="672.0" y="162.3" font-size="12" fill="#0b0b0b" text-anchor="middle">S1</text><rect x="728.0" y="136.0" width="108.0" height="44.0" rx="6" fill="#fde9e0"/><text x="782.0" y="162.3" font-size="12" fill="#0b0b0b" text-anchor="middle">S2</text><text x="16.0" y="202.0" font-size="12" fill="#52514e" text-anchor="start">The first 3 bytes never change and are used for alignment</text><text x="844.0" y="202.0" font-size="12" fill="#52514e" text-anchor="end">S1 = address + data sum, S2 = running sum of S1</text></svg>
