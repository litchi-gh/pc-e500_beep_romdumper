<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 232" width="860" height="232" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Yu Gothic UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans CJK JP&quot;, sans-serif" role="img"><title>各段階で読めたブロック</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#52514e"/></marker></defs><rect width="860" height="232" rx="8" fill="#fcfcfb"/><text x="260.0" y="24.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">本体 ROM（全 1024 ブロック）</text><line x1="260.0" y1="36.0" x2="260.0" y2="198.0" stroke="#c3c2b7" stroke-width="1"/><text x="248.0" y="58.0" font-size="12" fill="#52514e" text-anchor="end">学習と 1 ビットずつの読み取りだけ</text><path d="M260 42 H387.7 a4 4 0 0 1 4 4 V60 a4 4 0 0 1 -4 4 H260 Z" fill="#2a78d6" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><text x="398.7" y="58.0" font-size="13" fill="#0b0b0b" text-anchor="start">710</text><text x="248.0" y="98.0" font-size="12" fill="#52514e" text-anchor="end">+ ブロックの切り出し、候補、学び直し</text><path d="M260 82 H441.9 a4 4 0 0 1 4 4 V100 a4 4 0 0 1 -4 4 H260 Z" fill="#2a78d6" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><text x="452.9" y="98.0" font-size="13" fill="#0b0b0b" text-anchor="start">1002</text><text x="248.0" y="138.0" font-size="12" fill="#52514e" text-anchor="end">+ ビットの修復</text><path d="M260 122 H444.7 a4 4 0 0 1 4 4 V140 a4 4 0 0 1 -4 4 H260 Z" fill="#2a78d6" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><text x="455.7" y="138.0" font-size="13" fill="#0b0b0b" text-anchor="start">1017</text><text x="248.0" y="178.0" font-size="12" fill="#52514e" text-anchor="end">+ ほかの解析パターン</text><path d="M260 162 H446.0 a4 4 0 0 1 4 4 V180 a4 4 0 0 1 -4 4 H260 Z" fill="#2a78d6" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><text x="457.0" y="178.0" font-size="13" fill="#0b0b0b" text-anchor="start">1024</text><text x="550.0" y="24.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">拡張 ROM（全 512 ブロック）</text><line x1="550.0" y1="36.0" x2="550.0" y2="198.0" stroke="#c3c2b7" stroke-width="1"/><path d="M550 42 H683.7 a4 4 0 0 1 4 4 V60 a4 4 0 0 1 -4 4 H550 Z" fill="#2a78d6" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><text x="694.7" y="58.0" font-size="13" fill="#0b0b0b" text-anchor="start">371</text><path d="M550 82 H734.1 a4 4 0 0 1 4 4 V100 a4 4 0 0 1 -4 4 H550 Z" fill="#2a78d6" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><text x="745.1" y="98.0" font-size="13" fill="#0b0b0b" text-anchor="start">507</text><path d="M550 122 H734.1 a4 4 0 0 1 4 4 V140 a4 4 0 0 1 -4 4 H550 Z" fill="#2a78d6" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><text x="745.1" y="138.0" font-size="13" fill="#0b0b0b" text-anchor="start">507</text><path d="M550 162 H736.0 a4 4 0 0 1 4 4 V180 a4 4 0 0 1 -4 4 H550 Z" fill="#2a78d6" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><text x="747.0" y="178.0" font-size="13" fill="#0b0b0b" text-anchor="start">512</text><text x="16.0" y="222.0" font-size="12" fill="#52514e" text-anchor="start">PC-U6000 の録音。誤ったデータはどの段階でも 0。</text></svg>
