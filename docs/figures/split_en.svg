<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 150" width="860" height="150" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Yu Gothic UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans CJK JP&quot;, sans-serif" role="img"><title>Cutting joined blocks</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#52514e"/></marker></defs><rect width="860" height="150" rx="8" fill="#fcfcfb"/><text x="16.0" y="22.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">A ring fills the silences, so 3 blocks look like one burst</text><rect x="40.0" y="46.0" width="780.0" height="34.0" rx="3" fill="#e4effc"/><rect x="270.0" y="40.0" width="60.0" height="46.0" rx="3" fill="#fde9e0"/><line x1="300.0" y1="38.0" x2="300.0" y2="88.0" stroke="#d03b3b" stroke-width="2"/><rect x="530.0" y="40.0" width="60.0" height="46.0" rx="3" fill="#fde9e0"/><line x1="560.0" y1="38.0" x2="560.0" y2="88.0" stroke="#d03b3b" stroke-width="2"/><text x="170.0" y="68.0" font-size="13" fill="#0b0b0b" text-anchor="middle">Block</text><text x="430.0" y="68.0" font-size="13" fill="#0b0b0b" text-anchor="middle">Block</text><text x="690.0" y="68.0" font-size="13" fill="#0b0b0b" text-anchor="middle">Block</text><rect x="40.0" y="110.0" width="16.0" height="13.0" rx="2" fill="#fde9e0"/><text x="62.0" y="121.0" font-size="12" fill="#52514e" text-anchor="start">Block length range, known from the bit timing</text><line x1="460.0" y1="108.0" x2="460.0" y2="124.0" stroke="#d03b3b" stroke-width="2"/><text x="470.0" y="121.0" font-size="12" fill="#52514e" text-anchor="start">Cut at the quietest point in that range</text></svg>
