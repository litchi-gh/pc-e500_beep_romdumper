<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="860" height="410" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Yu Gothic UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans CJK JP&quot;, sans-serif" role="img"><title>Overview of the analysis</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#52514e"/></marker></defs><rect width="860" height="410" rx="8" fill="#fcfcfb"/><rect x="40.0" y="16.0" width="220.0" height="40.0" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/><text x="150.0" y="40.7" font-size="13" fill="#0b0b0b" text-anchor="middle">Recording</text><line x1="150.0" y1="56.0" x2="150.0" y2="80.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40.0" y="80.0" width="220.0" height="40.0" rx="6" fill="#f0efec"/><text x="150.0" y="104.7" font-size="13" fill="#0b0b0b" text-anchor="middle">1. Load the audio</text><line x1="150.0" y1="120.0" x2="150.0" y2="150.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20.0" y="150.0" width="820.0" height="166.0" rx="8" fill="#e4effc"/><text x="34.0" y="171.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">For each analysis pattern (from "standard")</text><rect x="34.0" y="204.0" width="160.0" height="56.0" rx="6" fill="#fcfcfb"/><text x="114.0" y="227.7" font-size="13" fill="#0b0b0b" text-anchor="middle">2. Preprocess</text><text x="114.0" y="245.7" font-size="12" fill="#52514e" text-anchor="middle">channel, high-pass</text><line x1="194.0" y1="232.0" x2="214.0" y2="232.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="214.0" y="204.0" width="160.0" height="56.0" rx="6" fill="#fcfcfb"/><text x="294.0" y="227.7" font-size="13" fill="#0b0b0b" text-anchor="middle">3. Find sound</text><text x="294.0" y="245.7" font-size="12" fill="#52514e" text-anchor="middle">level envelope</text><line x1="374.0" y1="232.0" x2="394.0" y2="232.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="394.0" y="204.0" width="160.0" height="56.0" rx="6" fill="#fcfcfb"/><text x="474.0" y="227.7" font-size="13" fill="#0b0b0b" text-anchor="middle">4. Which version</text><text x="474.0" y="245.7" font-size="12" fill="#52514e" text-anchor="middle">any long sound?</text><line x1="554.0" y1="232.0" x2="574.0" y2="232.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="574.0" y="186.0" width="230.0" height="44.0" rx="6" fill="#fcfcfb"/><text x="689.0" y="203.7" font-size="13" fill="#0b0b0b" text-anchor="middle">5. Machine code</text><text x="689.0" y="221.7" font-size="12" fill="#52514e" text-anchor="middle">waveform model, bit by bit</text><rect x="574.0" y="238.0" width="230.0" height="44.0" rx="6" fill="#fcfcfb"/><text x="689.0" y="255.7" font-size="13" fill="#0b0b0b" text-anchor="middle">6. BASIC</text><text x="689.0" y="273.7" font-size="12" fill="#52514e" text-anchor="middle">pitch, tone by tone</text><path d="M554 232 L564 232 L564 208 L573 208" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M564 232 L564 260 L573 260" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="430.0" y="306.0" font-size="12" fill="#52514e" text-anchor="middle">Stop once everything is read; otherwise the next pattern reads the rest</text><line x1="150.0" y1="316.0" x2="150.0" y2="344.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40.0" y="344.0" width="220.0" height="48.0" rx="6" fill="#f0efec"/><text x="150.0" y="363.7" font-size="13" fill="#0b0b0b" text-anchor="middle">7. Combine patterns</text><text x="150.0" y="381.7" font-size="12" fill="#52514e" text-anchor="middle">majority vote</text><line x1="260.0" y1="368.0" x2="340.0" y2="368.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="340.0" y="344.0" width="240.0" height="48.0" rx="6" fill="#f0efec"/><text x="460.0" y="363.7" font-size="13" fill="#0b0b0b" text-anchor="middle">8. Combine recordings</text><text x="460.0" y="381.7" font-size="12" fill="#52514e" text-anchor="middle">fill gaps, hold disagreements</text><line x1="580.0" y1="368.0" x2="620.0" y2="368.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="620.0" y="344.0" width="120.0" height="48.0" rx="6" fill="#0b0b0b"/><text x="680.0" y="372.7" font-size="13" fill="#fcfcfb" text-anchor="middle">ROM file</text></svg>
