<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;Yu Gothic UI&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans CJK JP&quot;, sans-serif" role="img"><title>How CSAVE M is read</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#52514e"/></marker></defs><rect width="860" height="300" rx="8" fill="#fcfcfb"/><rect x="16.0" y="22.0" width="192.0" height="62.0" rx="6" fill="#f0efec"/><text x="112.0" y="48.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Find the carriers</text><text x="112.0" y="65.8" font-size="11" fill="#52514e" text-anchor="middle">a pair of 10000 and 11000 cycles</text><line x1="208.0" y1="53.0" x2="230.0" y2="53.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="230.0" y="22.0" width="192.0" height="62.0" rx="6" fill="#f0efec"/><text x="326.0" y="48.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Learn from the header start</text><text x="326.0" y="65.8" font-size="11" fill="#52514e" text-anchor="middle">01h, name, 0Dh are predictable</text><line x1="422.0" y1="53.0" x2="444.0" y2="53.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="444.0" y="22.0" width="192.0" height="62.0" rx="6" fill="#f0efec"/><text x="540.0" y="48.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Read 3000 data bytes</text><text x="540.0" y="65.8" font-size="11" fill="#52514e" text-anchor="middle">relearn the response and bit lengths</text><line x1="636.0" y1="53.0" x2="658.0" y2="53.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="658.0" y="22.0" width="192.0" height="62.0" rx="6" fill="#f0efec"/><text x="754.0" y="48.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Read the header</text><text x="754.0" y="65.8" font-size="11" fill="#52514e" text-anchor="middle">read at many offsets and vote</text><path d="M766 84 L766 108 L112 108 L112 124" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="430.0" y="102.0" font-size="12" fill="#52514e" text-anchor="middle">If the header cannot be read, shift the position and redo the data (up to 9 tries)</text><rect x="16.0" y="124.0" width="828.0" height="84.0" rx="8" fill="#e4effc"/><text x="30.0" y="144.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">Read all the data</text><rect x="30.0" y="152.0" width="188.0" height="46.0" rx="6" fill="#fcfcfb"/><text x="124.0" y="170.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Byte by byte</text><text x="124.0" y="187.8" font-size="11" fill="#52514e" text-anchor="middle">compare 256 waveforms</text><line x1="218.0" y1="175.0" x2="232.0" y2="175.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="232.0" y="152.0" width="188.0" height="46.0" rx="6" fill="#fcfcfb"/><text x="326.0" y="170.8" font-size="12" fill="#0b0b0b" text-anchor="middle">FFh runs</text><text x="326.0" y="187.8" font-size="11" fill="#52514e" text-anchor="middle">count them by time</text><line x1="420.0" y1="175.0" x2="434.0" y2="175.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="434.0" y="152.0" width="188.0" height="46.0" rx="6" fill="#fcfcfb"/><text x="528.0" y="170.8" font-size="12" fill="#0b0b0b" text-anchor="middle">If lost</text><text x="528.0" y="187.8" font-size="11" fill="#52514e" text-anchor="middle">back up, try other paths</text><line x1="622.0" y1="175.0" x2="636.0" y2="175.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="636.0" y="152.0" width="188.0" height="46.0" rx="6" fill="#fcfcfb"/><text x="730.0" y="170.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Polish</text><text x="730.0" y="187.8" font-size="11" fill="#52514e" text-anchor="middle">fix swapped bits</text><line x1="430.0" y1="208.0" x2="430.0" y2="228.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16.0" y="228.0" width="268.0" height="56.0" rx="6" fill="#f0efec"/><text x="150.0" y="251.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Drop bytes under loud noise</text><text x="150.0" y="268.8" font-size="11" fill="#52514e" text-anchor="middle">their blocks count as not read (red)</text><line x1="284.0" y1="256.0" x2="300.0" y2="256.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="300.0" y="228.0" width="260.0" height="56.0" rx="6" fill="#f0efec"/><text x="430.0" y="251.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Number from the header address</text><text x="430.0" y="268.8" font-size="11" fill="#52514e" text-anchor="middle">every block read is yellow</text><line x1="560.0" y1="256.0" x2="576.0" y2="256.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="576.0" y="228.0" width="268.0" height="56.0" rx="6" fill="#f0efec"/><text x="710.0" y="251.8" font-size="12" fill="#0b0b0b" text-anchor="middle">Compare with other recordings</text><text x="710.0" y="268.8" font-size="11" fill="#52514e" text-anchor="middle">green if they agree, red if not</text></svg>
